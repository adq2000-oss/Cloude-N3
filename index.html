<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JLPT 단어 5회독</title>
<style>
:root{--bg:#0a0e1a;--card:#111a2e;--line:#1f2b45;--tx:#e8edf7;--mut:#8b97b3;--or:#f59e0b;--rd:#e11d48;--gr:#10b981;--W:46px;--S:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans KR","Noto Sans JP",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100dvh;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.b{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.hd{display:flex;align-items:center;gap:10px}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#f97316,#ef4444);display:grid;place-items:center;font-weight:800}
.ti{flex:1;line-height:1.2}.ti b{font-size:18px}.ti small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ch{flex:1;min-width:64px;text-align:center;font-size:13px;padding:8px 4px}
.ch.on{background:#4a1626;border-color:var(--rd);color:#fff}
.tb.on{background:var(--or);border-color:var(--or);color:#1a1000;font-weight:800}
.tb{padding:6px 9px;font-size:13px}
.cnt{margin-left:auto;font-size:12px;color:var(--mut)}.cnt b{color:var(--rd)}
.pr{display:flex;align-items:center;gap:clamp(3px,1.3vw,8px);font-size:clamp(10px,3.1vw,14px);color:var(--mut);white-space:nowrap;min-width:0}.pr>*{white-space:nowrap}.pr b{color:var(--tx)}
.pr .sp{flex:1;min-width:0}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px clamp(6px,2.4vw,12px);font-size:clamp(10px,3vw,13px);background:#16203a;color:var(--tx)}
.tag.or{border-color:#7a5a12;color:var(--or);background:#1f1808}
.ar{width:clamp(28px,8.5vw,38px);height:32px;padding:0;border-radius:12px;font-size:18px;flex:none}
.card{position:relative;flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;overflow:hidden}
.top{position:absolute;left:12px;top:10px;z-index:2}
.top i{font-style:normal;color:#fb7185;font-size:15px}
.x{position:absolute;right:12px;top:10px;border-radius:999px;padding:5px 11px;font-size:12px;line-height:1.2;color:#fda4af;border-color:#7f1d35}.top span+span{display:none}
.mid{flex:1;overflow:hidden;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;gap:4px;padding:34px 0 6px}
.w{font-size:var(--W);font-weight:800;line-height:1.15}
.s{font-size:var(--S);line-height:1.9}
.s.h{color:var(--mut);font-size:16px}.ph{white-space:nowrap}.tr{font-size:calc(var(--S)*.62);color:#b7c2dc;line-height:1.5;cursor:pointer;padding:2px 12px;text-wrap:balance}.rd{color:#fda4af;line-height:1.3;font-size:calc(var(--S)*.85)}.mid>:first-child{margin-top:auto}.mid>:last-child{margin-bottom:auto}
.k{color:var(--or)}.m{font-weight:700}.t{font-size:calc(var(--S)*.6);color:var(--mut);line-height:1.4}
ruby{display:inline-block;position:relative;cursor:pointer;border-bottom:1px dotted #55627f}ruby rt{display:block;position:absolute;left:50%;top:-1.05em;transform:translateX(-50%);white-space:nowrap;font-size:.55em;line-height:1;color:var(--or);visibility:hidden;pointer-events:none}ruby.on rt{visibility:visible}
.kj{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-family:'Noto Serif KR','Nanum Myeongjo','Noto Serif JP',serif}.kj div{display:flex;align-items:baseline;gap:6px;padding:2px 10px;border-top:1px solid var(--line)}.kj b{font-size:calc(var(--S)*1.1);color:var(--or)}.kj span{font-size:var(--S);color:#efe3c2}
.bt{display:flex;justify-content:space-between;align-items:center}
.sk{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;display:inline-grid;place-items:center}.sk.xs{width:30px;height:30px;font-size:14px;margin-bottom:-6px}.sb{width:100%;display:flex;flex-direction:column;align-items:flex-start}.sn{width:100%;text-align:center}
.sk.sm{width:54px;height:54px;font-size:24px;vertical-align:middle;margin-left:6px}
.ac{display:flex;gap:10px}
.ac button{flex:1;padding:8px;font-weight:700;font-size:14px;border-radius:14px}
.no{background:#3a0f1c;border:1px solid #7f1d35;color:#fda4af}
.ok{background:#073a2c;border:1px solid #0f6b4f;color:#6ee7b7}
.ac button:disabled{opacity:.35}
</style></head><body><div id="app"></div>
<script>document.write('<script src="words.js?v='+Date.now()+'"><\/script>')</script>
<script>
const R=[[1,15],[16,25],[26,35],[36,45]],RL=['1~15','16~25','26~35','36~45'],KEY='kotoba5v1';
const W=WORDS_RAW.trim().split('\n').filter(l=>l.includes('|')).map(l=>{const [d,w,r,m,k,s,t]=l.split('|');return{id:d+w+r,d:+d,w,r,m,k,s,t}});
let S={sel:[0],round:1,pos:{},out:{},flip:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const sel=()=>W.filter(x=>S.sel.some(i=>x.d>=R[i][0]&&x.d<=R[i][1]));
const inR=(x,r)=>{const o=S.out[x.id]||'';return o.length>=r-1&&/^x*$/.test(o.slice(0,r-1))};
const lst=()=>sel().filter(x=>inR(x,S.round));
const P=()=>Math.min(S.pos[S.round]||0,lst().length);
const ruby=s=>s.replace(/([\u4e00-\u9fff々]+)\[([^\]]+)\]/g,'<ruby data-a="ru">$1<rt>$2</rt></ruby>');
const plain=s=>s.replace(/\[[^\]]+\]/g,'');
function speak(t){if(!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;
 const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}
const PT='はがをにでともへや',isH=c=>/^[\u3041-\u3096]$/.test(c);
function sen(t){const u=[...t.matchAll(/([\u4e00-\u9fff々]+)\[([^\]]+)\]|([\s\S])/g)].map(m=>m[1]?`<ruby data-a="ru">${m[1]}<rt>${m[2]}</rt></ruby>`:m[3]);let o='',c='',n=0;
 u.forEach((x,i)=>{c+=x;n++;const nx=u[i+1];if(nx&&('、。！？'.includes(x)||n>=7||(PT.includes(x)&&n>1&&!isH(nx)))){o+=`<span class="ph">${c}</span>`;c='';n=0}});
 return o+(c?`<span class="ph">${c}</span>`:'')}
const SP='<svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/></svg>',SK='<button class="b sk" data-a="sw">'+SP+'</button>';
const kj=x=>{if(!x.k)return'';const ks=[...x.w].filter(c=>/[\u4e00-\u9fff々]/.test(c)),p=x.k.split(' · ');return ks.length==p.length?`<div class="kj">${ks.map((c,i)=>`<div><b>${c}</b><span>${p[i]}</span></div>`).join('')}</div>`:`<div class="s k">${x.k}</div>`};
const cxb=x=>{const o=(S.out[x.id]||'')[S.round-1];return o=='x'?'<button class="b x" data-a="cx">↩ 다음 회차 취소</button>':S.round>1?'<button class="b x" data-a="cx">↩ 이전 모름 취소</button>':''};
function fit(){const m=document.querySelector('.mid');if(!m)return;const st=document.documentElement.style,cs=getComputedStyle(m),av=()=>m.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),ov=()=>[...m.children].reduce((t,c)=>t+c.offsetHeight+4,0)-4>av()||m.scrollHeight>m.clientHeight+1||m.scrollWidth>m.clientWidth+1;const wd=m.querySelector('.w'),kana=wd&&!/[\u4e00-\u9fff]/.test(wd.textContent);let a=42,w=kana?48:69;const set=()=>{st.setProperty('--S',a+'px');st.setProperty('--W',w+'px')};set();while(ov()&&(a>16||w>34)){if(a>16)a--;if(a<30&&w>34)w--;set()}}
function render(){
 const L=lst(),p=P(),x=L[p],all=sel();
 const tabs=[1,2,3,4,5].map(r=>`<button class="b tb ${r==S.round?'on':''}" data-a="rd" data-v="${r}">${r}회(${sel().filter(y=>inR(y,r)).length})</button>`).join('');
 const chips=RL.map((l,i)=>`<button class="b ch ${S.sel.includes(i)?'on':''}" data-a="sl" data-v="${i}">${l}</button>`).join('');
 let card;
 if(!x){const n=L.filter(y=>(S.out[y.id]||'')[S.round-1]=='x').length;
  card=`<div class="card"><div class="mid"><div class="w" style="font-size:var(--S)">${L.length?`${S.round}회차 완료`:'대상 단어가 없습니다'}</div>${L.length?`<div class="s h">모름 ${n}개 → ${S.round<5?(S.round+1)+'회차로 이동':'5회독 끝'}</div>`:''}</div></div>`}
 else{const rd=x.r?x.r.split('/')[0]:x.w;
  const front=`<div class="top">${SK}</div>
   <div class="mid"><div class="w">${x.w}</div></div>`;
  const back=`<div class="top">${SK}</div>
   <div class="mid">${x.r?`<div class="s rd">${x.r}</div>`:''}<div class="w">${x.w}</div><div class="s m">${x.m}</div>${kj(x)}
   <div class="sb"><button class="b sk xs" data-a="ss">${SP}</button><div class="s sn">${sen(x.s)}</div></div><div class="tr" data-a="tr">${S.tr?x.t:'▸ 해석 보기'}</div></div>`;
  card=`<div class="card" data-a="fl">${cxb(x)}${S.flip?back:front}
   </div>`}
 const first=x?x.d:'';
 document.getElementById('app').innerHTML=`
 <div class="hd"><div class="logo">N3</div><div class="ti"><b>JLPT 단어 5회독</b><small>전체 ${W.length}단어 중 ${all.length}개 선택</small></div><button class="b" data-a="rs">↺ 리셋</button></div>
 <div class="pn"><div class="row">${chips}</div><div class="row">${tabs}<span class="cnt">이번 회차 대상: <b>${L.length}</b>단어</span></div></div>
 <div class="pr"><button class="b ar" data-a="pv">‹</button><span>진행: <b>${L.length?Math.min(p+1,L.length):0} / ${L.length}</b></span><button class="b ar" data-a="nx">›</button><span class="sp"></span>${x?`<span class="tag">Day ${first}</span>`:''}<span class="tag or">${S.round}회차 대상</span></div>
 ${card}
 <div class="ac"><button class="no" data-a="no" ${x?'':'disabled'}>✕ 모름</button><button class="ok" data-a="ok" ${x?'':'disabled'}>✓ 외움</button></div>`;
 fit();save()}
function ans(c){const x=lst()[P()];if(!x)return;const o=S.out[x.id]||'';S.out[x.id]=o.slice(0,S.round-1)+c;S.pos[S.round]=P()+1;S.flip=false}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=+t.dataset.v,L=lst(),p=P(),x=L[p];
 if(a=='ru'){t.classList.toggle('on');return}
 if(a=='sw'){speak(x&&(x.r?x.r.split('/')[0]:x.w));return}
 if(a=='ss'){speak(x&&plain(x.s));return}
 if(a=='tr'){S.tr=!S.tr;render();return}S.tr=false;
 if(a=='fl')S.flip=!S.flip;
 else if(a=='ok')ans('o');
 else if(a=='no')ans('x');
 else if(a=='cx'&&x){const o=S.out[x.id]||'';S.out[x.id]=o[S.round-1]=='x'?o.slice(0,S.round-1):o.slice(0,S.round-2)+'o';S.flip=false}
 else if(a=='pv'){S.pos[S.round]=Math.max(0,p-1);S.flip=false}
 else if(a=='nx'){S.pos[S.round]=p>=L.length?0:p+1;S.flip=false}
 else if(a=='rd'){S.round=v;S.flip=false}
 else if(a=='sl'){const i=S.sel.indexOf(v);if(i<0)S.sel.push(v);else if(S.sel.length>1)S.sel.splice(i,1);S.flip=false}
 else if(a=='rs'){if(!confirm('선택한 Day의 학습 기록을 지우고 1회차부터 다시 시작할까요?'))return;sel().forEach(y=>delete S.out[y.id]);S.round=1;S.pos={};S.flip=false}
 render()});
render();
</script></body></html>
